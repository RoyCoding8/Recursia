[project]
name = "recursia-backend"
version = "0.2.0"
description = "FastAPI backend for Recursia recursive multi-agent orchestration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.42.85",
    "fastapi>=0.115.0,<1.0.0",
    "litellm>=1.83.11",
    "idna>=3.15",
    "pydantic>=2.8.0,<3.0.0",
    "tenacity>=9.0.0",
    "uvicorn>=0.30.0,<1.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-anyio>=0.0.0",
    "ruff>=0.4.0",
]

[project.optional-dependencies]
docker = ["epicbox>=1.1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E731", "E402"]
